<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NetFlow AI - Secure Gateway</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-dark: #050608;
            --glass-bg: rgba(18, 22, 29, 0.65);
            --glass-border: rgba(255, 255, 255, 0.18);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --error-red: #ef4444;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background: radial-gradient(circle at 50% 40%, #12151d 0%, #050608 85%);
            color: var(--text-main);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 20px;
            perspective: 1000px;
        }

        #spaceCanvas {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
        }

        .space-nebula {
            position: fixed;
            top: -100px;
            left: 50%;
            transform: translateX(-50%);
            width: 800px;
            height: 450px;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.06) 0%, rgba(148, 163, 184, 0.02) 50%, transparent 75%);
            pointer-events: none;
            z-index: 1;
        }

        .splash-overlay {
            position: fixed;
            inset: 0;
            background: #050608;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 99;
            animation: splashFadeOut 0.8s ease 3.5s forwards;
        }

        .wifi-svg-box {
            position: relative;
            width: 120px;
            height: 100px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 24px;
        }

        .glow-aura {
            position: absolute;
            width: 100px;
            height: 100px;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.9) 0%, transparent 70%);
            border-radius: 50%;
            filter: blur(25px);
            animation: auraGlow 2.5s infinite alternate ease-in-out;
        }

        .wifi-svg {
            width: 90px;
            height: 90px;
            position: relative;
            z-index: 2;
            overflow: visible;
        }

        .wifi-part {
            fill: none;
            stroke: #ffffff;
            stroke-linecap: round;
            opacity: 0.15;
            animation: wifiConnectSeq 2.2s infinite ease-in-out;
        }

        .wifi-dot-part {
            fill: #ffffff;
            stroke: none;
            opacity: 0.2;
            animation: wifiDotSeq 2.2s infinite ease-in-out;
        }

        .wifi-line-1 { animation-delay: 0.3s; }
        .wifi-line-2 { animation-delay: 0.6s; }
        .wifi-line-3 { animation-delay: 0.9s; }

        @keyframes auraGlow {
            0% { opacity: 0.3; transform: scale(0.8); }
            100% { opacity: 0.9; transform: scale(1.3); }
        }

        @keyframes wifiDotSeq {
            0%, 15% { opacity: 0.2; }
            20%, 90% { opacity: 1; filter: drop-shadow(0 0 12px #ffffff); }
            100% { opacity: 0.2; }
        }

        @keyframes wifiConnectSeq {
            0%, 20% { opacity: 0.15; stroke-width: 5; }
            35%, 85% { stroke-width: 6; opacity: 1; filter: drop-shadow(0 0 15px #ffffff); }
            100% { opacity: 0.15; stroke-width: 5; }
        }

        .splash-title {
            font-family: 'Outfit', sans-serif;
            font-size: 42px;
            font-weight: 900;
            background: linear-gradient(135deg, #ffffff 0%, #94a3b8 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            animation: titleFadeIn 1.2s ease 0.5s forwards;
            opacity: 0;
        }

        .splash-subtitle {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 8px;
            letter-spacing: 2.5px;
            text-transform: uppercase;
            font-weight: 700;
            animation: titleFadeIn 1.2s ease 0.8s forwards;
            opacity: 0;
        }

        @keyframes titleFadeIn { to { opacity: 1; } }
        @keyframes splashFadeOut { to { opacity: 0; visibility: hidden; } }

        .auth-container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 520px;
            text-align: center;
        }

        .hero-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 16px;
            backdrop-filter: blur(10px);
            text-transform: uppercase;
        }

        .hero-title {
            font-family: 'Outfit', sans-serif;
            font-size: 44px;
            font-weight: 900;
            color: #ffffff;
            letter-spacing: -1px;
            text-transform: uppercase;
        }

        .hero-subtitle {
            color: var(--text-muted);
            font-size: 13.5px;
            margin-top: 6px;
            margin-bottom: 28px;
        }

        .card-wrapper {
            position: relative;
            width: 100%;
        }

        .card-backglow {
            position: absolute;
            inset: -15px;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.22) 0%, rgba(148, 163, 184, 0.08) 45%, transparent 75%);
            border-radius: 36px;
            filter: blur(28px);
            z-index: 1;
            pointer-events: none;
            animation: backglowPulse 2.5s infinite alternate ease-in-out;
        }

        @keyframes backglowPulse {
            0% { opacity: 0.5; transform: scale(0.97); }
            100% { opacity: 1; transform: scale(1.03); }
        }

        .auth-card {
            position: relative;
            z-index: 2;
            background: var(--glass-bg);
            backdrop-filter: blur(32px) saturate(190%);
            -webkit-backdrop-filter: blur(32px) saturate(190%);
            border: 1px solid var(--glass-border);
            border-radius: 28px;
            padding: 36px 32px;
            box-shadow: 0 30px 70px rgba(0, 0, 0, 0.9), 
                        inset 0 1px 1px rgba(255, 255, 255, 0.25),
                        0 0 30px rgba(255, 255, 255, 0.05);
            transform-style: preserve-3d;
            transition: transform 0.2s ease-out;
        }

        .auth-tabs {
            display: flex;
            background: rgba(8, 10, 14, 0.8);
            border: 1px solid var(--glass-border);
            padding: 4px;
            border-radius: 14px;
            margin-bottom: 24px;
        }

        .tab-btn {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 11px;
            border-radius: 10px;
            font-weight: 800;
            font-size: 12px;
            cursor: pointer;
            transition: 0.3s;
            letter-spacing: 0.5px;
        }

        .tab-btn.active {
            background: #ffffff;
            color: #08090b;
            box-shadow: 0 4px 18px rgba(255, 255, 255, 0.35);
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            text-align: left;
        }

        .full-width { grid-column: span 2; }

        .form-group label {
            display: block;
            font-size: 11px;
            font-weight: 700;
            color: #cbd5e1;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .input-box {
            width: 100%;
            background: rgba(8, 10, 14, 0.9);
            border: 1px solid var(--glass-border);
            color: #ffffff;
            padding: 12px 14px;
            border-radius: 12px;
            font-size: 13.5px;
            outline: none;
            transition: 0.3s;
        }

        .input-box:focus {
            border-color: #ffffff;
            box-shadow: 0 0 18px rgba(255, 255, 255, 0.3);
        }

        select.input-box option {
            background: #0d1117;
            color: #fff;
        }

        .signup-field { display: none; }

        .age-warning {
            display: none;
            background: rgba(239, 68, 68, 0.12);
            border: 1px solid var(--error-red);
            color: #fca5a5;
            font-size: 12px;
            padding: 10px 14px;
            border-radius: 10px;
            margin-top: 10px;
            text-align: left;
            font-weight: 600;
        }

        .btn-submit {
            width: 100%;
            background: linear-gradient(135deg, #ffffff 0%, #cbd5e1 100%);
            color: #08090b;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-weight: 800;
            font-size: 14px;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 18px;
            box-shadow: 0 4px 22px rgba(255, 255, 255, 0.2);
        }

        .btn-submit:hover {
            opacity: 0.95;
            transform: translateY(-1px);
            box-shadow: 0 6px 30px rgba(255, 255, 255, 0.4);
        }
    </style>
</head>
<body>

    <div class="space-nebula"></div>
    <canvas id="spaceCanvas"></canvas>

    <div class="splash-overlay">
        <div class="wifi-svg-box">
            <div class="glow-aura"></div>
            <svg class="wifi-svg" viewBox="0 0 100 100">
                <circle class="wifi-dot-part" cx="50" cy="80" r="5" />
                <path class="wifi-part wifi-line-1" d="M 36 66 A 20 20 0 0 1 64 66" />
                <path class="wifi-part wifi-line-2" d="M 22 52 A 38 38 0 0 1 78 52" />
                <path class="wifi-part wifi-line-3" d="M 8 38 A 56 56 0 0 1 92 38" />
            </svg>
        </div>
        <div class="splash-title">NETFLOW-AI</div>
        <div class="splash-subtitle">Hardware Network Gateway Active</div>
    </div>

    <div class="auth-container">
        <div class="hero-badge"><i class="fa-solid fa-wifi"></i> GATEWAY NETWORK OS</div>
        <h1 class="hero-title">NETFLOW-AI</h1>
        <p class="hero-subtitle">Intelligent Wi-Fi Gateway Control & Hardware Hub</p>

        <div class="card-wrapper">
            <div class="card-backglow"></div>

            <div class="auth-card" id="tiltCard">
                <div class="auth-tabs">
                    <button type="button" class="tab-btn active" id="loginTab" onclick="switchMode('login')">LOGIN</button>
                    <button type="button" class="tab-btn" id="signupTab" onclick="switchMode('signup')">SIGN UP</button>
                </div>

                <form id="authForm" onsubmit="handleAuthSubmit(event)">
                    <div class="form-grid">
                        
                        <div class="form-group signup-field">
                            <label>Owner Name *</label>
                            <input type="text" id="ownerName" name="name" class="input-box" placeholder="Full Name">
                        </div>

                        <div class="form-group signup-field">
                            <label>Phone Number *</label>
                            <input type="tel" id="phone" name="phone" class="input-box" placeholder="+91 XXXXX XXXXX">
                        </div>

                        <div class="form-group signup-field">
                            <label>Location *</label>
                            <input type="text" id="location" name="location" class="input-box" placeholder="enter your location">
                        </div>

                        <div class="form-group signup-field">
                            <label>Organization Type *</label>
                            <select id="orgType" name="org_type" class="input-box">
                                <option value="College">College / Campus</option>
                                <option value="School">School</option>
                                <option value="Office">Corporate Office</option>
                                <option value="Hostel">Hostel Network</option>
                            </select>
                        </div>

                        <div class="form-group signup-field full-width">
                            <label>Number of Hotspots / Routers *</label>
                            <input type="number" id="routersCount" name="routers_count" class="input-box" placeholder="e.g. 1" min="1" max="10" value="1">
                        </div>

                        <div class="form-group full-width">
                            <label>Email Address *</label>
                            <input type="email" id="email" name="email" class="input-box" placeholder="enter your email" required>
                        </div>

                        <div class="form-group full-width">
                            <label>Password *</label>
                            <input type="password" id="password" name="password" class="input-box" placeholder="enter your password" required>
                        </div>

                    </div>

                    <div id="ageWarning" class="age-warning"></div>

                    <button type="submit" class="btn-submit" id="submitBtn">Launch Gateway</button>
                </form>
            </div>
        </div>
    </div>

    <script>
        let currentMode = 'login';

        const canvas = document.getElementById('spaceCanvas');
        const ctx = canvas.getContext('2d');

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        const NUM_STARS = 160;
        const stars = Array.from({ length: NUM_STARS }, () => ({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            z: Math.random() * canvas.width,
            radius: Math.random() * 0.9 + 0.3,
            speed: Math.random() * 1.5 + 0.6,
            opacity: Math.random() * 0.7 + 0.3,
            twinkle: Math.random() * 0.05
        }));

        function drawSpace() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            stars.forEach(s => {
                s.z -= s.speed;
                if (s.z <= 0) {
                    s.z = canvas.width;
                    s.x = Math.random() * canvas.width;
                    s.y = Math.random() * canvas.height;
                }
                const k = 250 / s.z;
                const px = (s.x - canvas.width / 2) * k + canvas.width / 2;
                const py = (s.y - canvas.height / 2) * k + canvas.height / 2;

                if (px >= 0 && px <= canvas.width && py >= 0 && py <= canvas.height) {
                    s.opacity += Math.sin(Date.now() * 0.003 + s.x) * 0.01;
                    const clampedOpacity = Math.max(0.2, Math.min(1, s.opacity));
                    const currentRadius = Math.max(0.4, s.radius * k);

                    ctx.beginPath();
                    ctx.arc(px, py, currentRadius, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(255, 255, 255, ${clampedOpacity})`;
                    ctx.shadowBlur = currentRadius * 4;
                    ctx.shadowColor = '#ffffff';
                    ctx.fill();
                }
            });
            requestAnimationFrame(drawSpace);
        }
        drawSpace();

        const tiltCard = document.getElementById('tiltCard');
        document.addEventListener('mousemove', (e) => {
            const x = (window.innerWidth / 2 - e.pageX) / 45;
            const y = (window.innerHeight / 2 - e.pageY) / 45;
            tiltCard.style.transform = `rotateY(${-x}deg) rotateX(${y}deg)`;
        });

        function switchMode(mode) {
            currentMode = mode;
            document.getElementById('loginTab').classList.toggle('active', mode === 'login');
            document.getElementById('signupTab').classList.toggle('active', mode === 'signup');
            
            document.querySelectorAll('.signup-field').forEach(el => {
                el.style.display = mode === 'signup' ? 'block' : 'none';
            });

            document.getElementById('submitBtn').innerText = mode === 'signup' ? 'Create Account' : 'Launch Gateway';
            document.getElementById('ageWarning').style.display = 'none';
        }

        async function handleAuthSubmit(event) {
            event.preventDefault();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();

            if (currentMode === 'signup') {
                const name = document.getElementById('ownerName').value.trim();
                const phone = document.getElementById('phone').value.trim();
                const location = document.getElementById('location').value.trim();
                const org_type = document.getElementById('orgType').value;
                const routers_count = document.getElementById('routersCount').value;

                if (!name || !phone || !location) {
                    alert('Please fill all mandatory fields!');
                    return;
                }

                try {
                    const response = await fetch('/api/signup', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ name, phone, location, org_type, routers_count, email, password })
                    });
                    const resData = await response.json();
                    if (resData.success) {
                        window.location.href = '/owner_setup';
                    } else {
                        alert(resData.message || 'Signup failed!');
                    }
                } catch (e) {
                    alert('Backend Server connect avaledhu!');
                }
            } else {
                try {
                    const response = await fetch('/api/login', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ email, password })
                    });
                    const resData = await response.json();
                    if (resData.success) {
                        window.location.href = '/dashboard';
                    } else {
                        alert(resData.message || 'Invalid Credentials!');
                    }
                } catch (e) {
                    alert('Backend Server connect avaledhu!');
                }
            }
        }
    </script>
</body>
</html>
